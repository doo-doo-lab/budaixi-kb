site_name: 霹雳、金光&东离布袋戏百科
site_description: 霹雳布袋戏、金光布袋戏、Thunderbolt Fantasy 东离剑游纪 角色与剧情资料库
site_url: https://doo-doo-lab.github.io/budaixi-kb/
repo_url: https://github.com/doo-doo-lab/budaixi-kb
repo_name: doo-doo-lab/budaixi-kb
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换深色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - zh
        - en
      # 中文场景调整 separator：不在中文字之间额外分词（依赖 jieba），
      # 配合下方自定义 JS 限制查询最少 2 字，避免「吞」「魔」单字 token 干扰排序
      separator: '[\s​\-,;:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - awesome-pages:
      strict: false
  - git-revision-date-localized:
      type: iso_date
      timezone: Asia/Shanghai
      locale: zh
      enable_creation_date: true
      fallback_to_build_date: true

# 不要把备份目录纳入站点
exclude_docs: |
  .pre_ai_backup/
  .pre_merge_backup/
  .pre_yaml_backup/
  .pre_preclean_backup/
  .pre_reunify_backup/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: "#"
      permalink_title: 永久链接
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/doo-doo-lab/budaixi-kb

copyright: |
  内容来自百度百科、霹雳官网、东离官网、维基百科等公开资料 ·
  本站仅作粉丝整理用途
