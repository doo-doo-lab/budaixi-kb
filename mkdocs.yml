site_name: 霹雳、金光&东离布袋戏百科
site_description: 霹雳布袋戏、金光布袋戏、Thunderbolt Fantasy 东离剑游纪 角色与剧情资料库
site_url: https://akira17189-create.github.io/budaixi-kb/
repo_url: https://github.com/akira17189-create/budaixi-kb
repo_name: akira17189-create/budaixi-kb
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换深色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - zh
        - en
  - awesome-pages:
      strict: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: "#"
      permalink_title: 永久链接
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/akira17189-create/budaixi-kb

copyright: |
  内容来自百度百科、霹雳官网、东离官网、维基百科等公开资料 ·
  本站仅作粉丝整理用途
